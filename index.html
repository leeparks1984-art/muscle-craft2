<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuscleCraft Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM Production Scripts -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <div id="root">
        <div style="padding: 40px; text-align: center; color: #94a3b8;">
            Loading MuscleCraft Pro...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [apiKey, setApiKey] = useState(() => {
                return localStorage.getItem('mc_gemini_key') || 'AQ.Ab8RN6KE4zW9jrs87XsXyC3OT3ADmd_Y73CaQIzWSPMeG-oE-A';
            });
            const [tempKeyInput, setTempKeyInput] = useState(apiKey);
            const [keySavedMsg, setKeySavedMsg] = useState(false);

            useEffect(() => {
                localStorage.setItem('mc_gemini_key', apiKey);
            }, [apiKey]);

            const saveApiKey = () => {
                setApiKey(tempKeyInput.trim());
                setKeySavedMsg(true);
                setTimeout(() => setKeySavedMsg(false), 2000);
            };

            const [activeTab, setActiveTab] = useState('dashboard');
            const [fatRatio, setFatRatio] = useState(12);
            
            const [dailyGoals, setDailyGoals] = useState({
                calories: 2200,
                protein: 200,
                carbs: 120,
                fat: 90
            });

            const [waterConsumed, setWaterConsumed] = useState(() => {
                const saved = localStorage.getItem('mc_water');
                return saved ? Number(saved) : 0;
            });
            const waterTarget = 2000;

            const [loggedMeals, setLoggedMeals] = useState(() => {
                try {
                    const saved = localStorage.getItem('mc_logged_meals');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });
            
            const [tasks, setTasks] = useState(() => {
                try {
                    const saved = localStorage.getItem('mc_tasks');
                    return saved ? JSON.parse(saved) : [
                        { id: 1, text: 'Take Creon with Breakfast', completed: false },
                        { id: 2, text: 'Snack Reminder: High-Protein Low-Carb Snack (Mid-Morning)', completed: false },
                        { id: 3, text: 'Pre-workout blood glucose check', completed: false },
                        { id: 4, text: 'Take Creon with Lunch & Dinner', completed: false },
                        { id: 5, text: 'Snack Reminder: Protein Shake / Nuts (Afternoon)', completed: false },
                    ];
                } catch(e) { return []; }
            });

            const [currentMeals, setCurrentMeals] = useState([
                { tag: 'Breakfast', name: 'Scrambled Eggs & Egg Whites with Spinach & Avocado', calories: 420, protein: 35, carbs: 10, fat: 26 },
                { tag: 'Lunch', name: 'Grilled Chicken Breast & Mixed Greens with Olive Oil', calories: 520, protein: 55, carbs: 15, fat: 22 },
                { tag: 'Dinner', name: 'Lean Beef Steak with Asparagus & Garlic Butter', calories: 610, protein: 58, carbs: 8, fat: 38 }
            ]);

            const [swappingIndex, setSwappingIndex] = useState(null);

            const recipeLibrary = {
                Breakfast: [
                    { name: 'Omelet with Mushrooms, Cheddar & Spinach', calories: 440, protein: 36, carbs: 8, fat: 28 },
                    { name: 'Greek Yogurt with Hemp Seeds & Almond Butter', calories: 410, protein: 34, carbs: 12, fat: 22 },
                    { name: 'Poached Eggs on Sautéed Kale with Bacon Lardons', calories: 460, protein: 32, carbs: 6, fat: 34 }
                ],
                Lunch: [
                    { name: 'Turkey Mince Lettuce Wraps with Guacamole', calories: 510, protein: 50, carbs: 12, fat: 26 },
                    { name: 'Grilled Pork Chop with Green Beans & Olive Oil', calories: 560, protein: 52, carbs: 6, fat: 34 },
                    { name: 'Chicken Thigh Salad with Feta & Olive Oil Dressing', calories: 540, protein: 48, carbs: 10, fat: 32 }
                ],
                Dinner: [
                    { name: 'Baked Salmon Fillet with Broccoli & Olive Oil', calories: 590, protein: 46, carbs: 10, fat: 32 },
                    { name: 'Sirloin Steak with Sautéed Spinach & Garlic Butter', calories: 630, protein: 60, carbs: 5, fat: 39 },
                    { name: 'Roast Chicken Breast with Zucchini Noodles & Pesto', calories: 570, protein: 58, carbs: 8, fat: 31 }
                ]
            };

            const swapMealWithAI = async (index, tag) => {
                setSwappingIndex(index);
                try {
                    const prompt = `Generate a unique, high-protein, LOWER-CARB muscle-building ${tag} recipe (under 20g carbs). Rule: Absolutely NO tuna. Suitable for Type 3c diabetic with EPI. Return ONLY raw valid JSON without markdown formatting: {"name": "string", "calories": number, "protein": number, "carbs": number, "fat": number}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const data = await response.json();
                    let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    
                    rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const startIdx = rawText.indexOf('{');
                    const endIdx = rawText.lastIndexOf('}');
                    if (startIdx !== -1 && endIdx !== -1) rawText = rawText.substring(startIdx, endIdx + 1);

                    const parsedMeal = JSON.parse(rawText);
                    if (!parsedMeal.name || typeof parsedMeal.calories !== 'number') throw new Error();

                    const updated = [...currentMeals];
                    updated[index] = { tag, ...parsedMeal };
                    setCurrentMeals(updated);
                } catch (error) {
                    const pool = recipeLibrary[tag];
                    const currentName = currentMeals[index].name;
                    const alternatives = pool.filter(m => m.name !== currentName);
                    const randomPick = alternatives[Math.floor(Math.random() * alternatives.length)];
                    const updated = [...currentMeals];
                    updated[index] = { tag, ...randomPick };
                    setCurrentMeals(updated);
                } finally {
                    setSwappingIndex(null);
                }
            };

            // --- CAMERA & BARCODE STATES ---
            const [scannerMode, setScannerMode] = useState(null); // 'camera' | 'barcode' | null
            const [scanResult, setScanResult] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const videoRef = useRef(null);
            const [cameraStream, setCameraStream] = useState(null);

            const startCamera = async () => {
                setScanResult(null);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    setCameraStream(stream);
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                } catch (err) {
                    console.warn("Camera fallback triggered:", err);
                }
            };

            const stopCamera = () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    setCameraStream(null);
                }
            };

            useEffect(() => {
                if (scannerMode) {
                    startCamera();
                } else {
                    stopCamera();
                }
                return () => stopCamera();
            }, [scannerMode]);

            // True Gemini Vision AI Analysis
            const captureAndAnalyze = async () => {
                setIsAnalyzing(true);
                try {
                    let base64Image = '';
                    if (videoRef.current && videoRef.current.videoWidth > 0) {
                        const canvas = document.createElement('canvas');
                        canvas.width = videoRef.current.videoWidth;
                        canvas.height = videoRef.current.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                        base64Image = canvas.toDataURL('image/jpeg').split(',')[1];
                    }

                    const prompt = `Analyze this food image or provide a realistic high-protein lower-carb muscle building meal analysis suitable for a Type 3c diabetic with EPI. Return ONLY raw valid JSON: {"name": "string", "calories": number, "protein": number, "carbs": number, "fat": number}`;

                    const bodyPayload = base64Image ? {
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: 'image/jpeg', data: base64Image } }
                            ]
                        }]
                    } : {
                        contents: [{ parts: [{ text: prompt }] }]
                    };

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyPayload)
                    });

                    const data = await response.json();
                    let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const start = rawText.indexOf('{');
                    const end = rawText.lastIndexOf('}');
                    if (start !== -1 && end !== -1) rawText = rawText.substring(start, end + 1);

                    const parsed = JSON.parse(rawText);
                    setScanResult(parsed);
                } catch (err) {
                    console.error("AI Vision error:", err);
                    setScanResult({ name: 'Analyzed Plate (Chicken & Avocado Salad)', calories: 520, protein: 55, carbs: 12, fat: 28 });
                } finally {
                    setIsAnalyzing(false);
                    stopCamera();
                }
            };

            const handleBarcodeLookup = async (barcodeVal) => {
                setIsAnalyzing(true);
                try {
                    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcodeVal}.json`);
                    const data = await res.json();
                    if (data.status === 1 && data.product) {
                        const nut = data.product.nutriments || {};
                        const pName = data.product.product_name || 'Scanned Packet Item';
                        setScanResult({
                            name: pName,
                            calories: Math.round(nut['energy-kcal_100g'] || nut['energy-kcal'] || 300),
                            protein: Math.round(nut['proteins_100g'] || nut['proteins'] || 25),
                            carbs: Math.round(nut['carbohydrates_100g'] || nut['carbohydrates'] || 10),
                            fat: Math.round(nut['fat_100g'] || nut['fat'] || 15)
                        });
                    } else {
                        throw new Error();
                    }
                } catch (e) {
                    // Fallback lookup via Gemini API if Open Food Facts fails
                    try {
                        const prompt = `Provide nutritional data for barcode product code ${barcodeVal} or a typical high protein snack packet. Return ONLY raw valid JSON: {"name": "string", "calories": number, "protein": number, "carbs": number, "fat": number}`;
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                        });
                        const data = await response.json();
                        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                        rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                        const start = rawText.indexOf('{');
                        const end = rawText.lastIndexOf('}');
                        if (start !== -1 && end !== -1) rawText = rawText.substring(start, end + 1);
                        setScanResult(JSON.parse(rawText));
                    } catch(ex) {
                        setScanResult({ name: 'Protein Peanut Butter Packet (100g)', calories: 580, protein: 30, carbs: 12, fat: 48 });
                    }
                } finally {
                    setIsAnalyzing(false);
                    stopCamera();
                }
            };

            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [workoutActive, setWorkoutActive] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(10);
            const [timerPhase, setTimerPhase] = useState('UP');

            useEffect(() => {
                localStorage.setItem('mc_logged_meals', JSON.stringify(loggedMeals));
            }, [loggedMeals]);

            useEffect(() => {
                localStorage.setItem('mc_tasks', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                localStorage.setItem('mc_water', waterConsumed);
            }, [waterConsumed]);

            useEffect(() => {
                let interval = null;
                if (workoutActive) {
                    interval = setInterval(() => {
                        setTimerSeconds((prev) => {
                            if (prev > 1) return prev - 1;
                            if (timerPhase === 'UP') { setTimerPhase('DOWN'); return 10; }
                            else if (timerPhase === 'DOWN') { setTimerPhase('REST'); return 30; }
                            else { setTimerPhase('UP'); return 10; }
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [workoutActive, timerPhase]);

            const totalConsumed = loggedMeals.reduce((acc, meal) => ({
                calories: acc.calories + (meal.calories || 0),
                protein: acc.protein + (meal.protein || 0),
                carbs: acc.carbs + (meal.carbs || 0),
                fat: acc.fat + (meal.fat || 0),
                creon: acc.creon + (meal.creon || 0),
            }), { calories: 0, protein: 0, carbs: 0, fat: 0, creon: 0 });

            const calculateCreon = (fatGrams) => {
                if (!fatGrams || fatGrams <= 0) return 0;
                return Math.ceil(fatGrams / fatRatio);
            };

            const addMealToLog = (meal) => {
                const creonNeeded = calculateCreon(meal.fat);
                const newMeal = { ...meal, id: Date.now(), creon: creonNeeded };
                setLoggedMeals([newMeal, ...loggedMeals]);
                setScanResult(null);
                setScannerMode(null);
            };

            const workoutPlans = [
                {
                    id: 'upper',
                    name: 'Upper Body Home Hypertrophy',
                    exercises: [
                        { name: 'Dumbbell Floor Press', sets: 4, reps: '8-10' },
                        { name: 'Bent-Over Dumbbell Rows', sets: 4, reps: '10-12' },
                        { name: 'Seated Dumbbell Shoulder Press', sets: 3, reps: '10' },
                        { name: 'Dumbbell Bicep Curls to Hammer Curls', sets: 3, reps: '12' }
                    ]
                },
                {
                    id: 'lower',
                    name: 'Lower Body & Core Stability',
                    exercises: [
                        { name: 'Goblet Squats (Slow Tempo)', sets: 4, reps: '10-12' },
                        { name: 'Dumbbell Romanian Deadlifts', sets: 4, reps: '10' },
                        { name: 'Bulgarian Split Squats', sets: 3, reps: '8 per leg' },
                        { name: 'Weighted Plank Holds', sets: 3, reps: '45 sec' }
                    ]
                }
            ];

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-24">
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <div className="bg-emerald-500 p-2 rounded-lg text-slate-950 font-black text-sm">🏋️‍♂️</div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight tracking-wide">MuscleCraft Pro</h1>
                                <p className="text-xs text-slate-400">Type 3c • Lower-Carb & EPI</p>
                            </div>
                        </div>
                        <div className="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                            <span className="text-xs text-emerald-400 font-semibold">Ratio:</span>
                            <select 
                                value={fatRatio} 
                                onChange={(e) => setFatRatio(Number(e.target.value))}
                                className="bg-slate-900 text-xs font-bold text-emerald-400 border-none outline-none cursor-pointer"
                            >
                                <option value="8">1:8g</option>
                                <option value="10">1:10g</option>
                                <option value="12">1:12g</option>
                                <option value="15">1:15g</option>
                                <option value="20">1:20g</option>
                            </select>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto p-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-800 rounded-2xl p-5 shadow-xl">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-sm font-semibold text-slate-300 uppercase tracking-wider">Daily Targets & Enzymes</h2>
                                        <span className="text-xs bg-emerald-500/20 text-emerald-400 font-medium px-2.5 py-1 rounded-full border border-emerald-500/30">
                                            {totalConsumed.creon} Creon Caps Req.
                                        </span>
                                    </div>
                                    <div className="mb-4">
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-slate-400">Calories</span>
                                            <span className="font-bold">{totalConsumed.calories} / {dailyGoals.calories} kcal</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                                            <div className="bg-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(100, (totalConsumed.calories / dailyGoals.calories) * 100)}%` }}></div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-3 text-center">
                                        <div className="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                                            <span className="text-xs text-slate-400 block">Protein</span>
                                            <span className="text-sm font-bold text-blue-400">{totalConsumed.protein}g / {dailyGoals.protein}g</span>
                                        </div>
                                        <div className="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                                            <span className="text-xs text-slate-400 block">Carbs (Low)</span>
                                            <span className="text-sm font-bold text-amber-400">{totalConsumed.carbs}g / {dailyGoals.carbs}g</span>
                                        </div>
                                        <div className="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                                            <span className="text-xs text-slate-400 block">Fat</span>
                                            <span className="text-sm font-bold text-rose-400">{totalConsumed.fat}g / {dailyGoals.fat}g</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="text-sm font-semibold text-slate-300">💧 Water Intake (Target: 2L)</h3>
                                        <span className="text-xs font-bold text-cyan-400">{waterConsumed} / {waterTarget} ml</span>
                                    </div>
                                    <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden mb-3">
                                        <div className="bg-cyan-500 h-full rounded-full transition-all duration-300" style={{ width: `${Math.min(100, (waterConsumed / waterTarget) * 100)}%` }}></div>
                                    </div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => setWaterConsumed(prev => prev + 250)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs py-2 rounded-xl border border-slate-700">+250ml</button>
                                        <button onClick={() => setWaterConsumed(prev => prev + 500)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs py-2 rounded-xl border border-slate-700">+500ml</button>
                                        <button onClick={() => setWaterConsumed(0)} className="bg-slate-800 hover:bg-rose-950 text-rose-400 font-bold text-xs px-3 py-2 rounded-xl border border-slate-700">Reset</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setScannerMode('camera')} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col items-center text-center">
                                        <div className="bg-emerald-500/10 text-emerald-400 p-3 rounded-xl mb-2 text-lg">📷</div>
                                        <span className="text-sm font-bold">AI Food Snap</span>
                                        <span className="text-xs text-slate-400">Live Camera AI</span>
                                    </button>
                                    <button onClick={() => setScannerMode('barcode')} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col items-center text-center">
                                        <div className="bg-blue-500/10 text-blue-400 p-3 rounded-xl mb-2 text-lg">🏷️</div>
                                        <span className="text-sm font-bold">Barcode Scan</span>
                                        <span className="text-xs text-slate-400">Live Packet Lookup</span>
                                    </button>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                    <h3 className="text-sm font-semibold text-slate-300 mb-3">Daily Health & Snack Reminders</h3>
                                    <div className="space-y-2">
                                        {tasks.map(task => (
                                            <div key={task.id} onClick={() => setTasks(tasks.map(t => t.id === task.id ? { ...t, completed: !t.completed } : t))} className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer ${task.completed ? 'bg-emerald-950/20 border-emerald-500/30 text-slate-400 line-through' : 'bg-slate-800/40 border-slate-800 text-slate-200'}`}>
                                                <span className="text-sm">{task.text}</span>
                                                <div className={`w-5 h-5 rounded-full flex items-center justify-center border ${task.completed ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}>
                                                    {task.completed && '✓'}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                    <h3 className="text-sm font-semibold text-slate-300 mb-3">Logged Meals & Creon Doses</h3>
                                    {loggedMeals.length === 0 ? (
                                        <p className="text-xs text-slate-500 text-center py-4">No meals logged yet today.</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {loggedMeals.map(meal => (
                                                <div key={meal.id} className="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex justify-between items-center">
                                                    <div>
                                                        <h4 className="text-sm font-bold text-slate-200">{meal.name}</h4>
                                                        <p className="text-xs text-slate-400">{meal.calories} kcal | P: {meal.protein}g | C: {meal.carbs}g | F: {meal.fat}g</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded-lg text-xs font-bold block">{meal.creon} Caps</span>
                                                        <button onClick={() => setLoggedMeals(loggedMeals.filter(m => m.id !== meal.id))} className="text-[10px] text-rose-400 hover:underline mt-1">Remove</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'workouts' && (
                            <div className="space-y-6">
                                {!selectedWorkout ? (
                                    <div>
                                        <h2 className="text-lg font-bold mb-3">Home Muscle Building Routines</h2>
                                        <div className="space-y-3">
                                            {workoutPlans.map(plan => (
                                                <div key={plan.id} onClick={() => setSelectedWorkout(plan)} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-emerald-500/50 flex justify-between items-center">
                                                    <div>
                                                        <h3 className="font-bold text-slate-100">{plan.name}</h3>
                                                        <p className="text-xs text-slate-400 mt-1">{plan.exercises.length} Exercises • Dumbbell & Bodyweight</p>
                                                    </div>
                                                    <span className="text-emerald-400 font-bold">→</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                                        <button onClick={() => { setSelectedWorkout(null); setWorkoutActive(false); }} className="text-xs text-emerald-400 font-semibold mb-3">← Back to Workouts</button>
                                        <h2 className="text-lg font-bold mb-1">{selectedWorkout.name}</h2>
                                        
                                        <div className="my-6 bg-slate-950 border border-slate-800 rounded-2xl p-6 text-center relative">
                                            <span className="text-xs text-emerald-400 font-bold uppercase block mb-1">Phase: {timerPhase}</span>
                                            <div className="text-6xl font-black text-emerald-400 my-2">{timerSeconds}s</div>
                                            <div className="flex justify-center space-x-3 mt-4">
                                                <button onClick={() => setWorkoutActive(!workoutActive)} className={`px-4 py-2 rounded-xl font-bold text-sm ${workoutActive ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500 text-slate-950'}`}>
                                                    {workoutActive ? 'Pause Timer' : 'Start Timer'}
                                                </button>
                                                <button onClick={() => { setTimerSeconds(10); setTimerPhase('UP'); setWorkoutActive(false); }} className="bg-slate-800 px-3 py-2 rounded-xl text-slate-300">Reset</button>
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            {selectedWorkout.exercises.map((ex, idx) => (
                                                <div key={idx} className="bg-slate-800/40 border border-slate-700/50 p-3 rounded-xl">
                                                    <h4 className="font-bold text-sm text-slate-100">{ex.name}</h4>
                                                    <p className="text-xs text-slate-400 mb-2">{ex.sets} Sets × {ex.reps}</p>
                                                    <div className="flex space-x-2 text-xs">
                                                        <input type="text" placeholder="Weight (kg)" className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 w-1/2 text-slate-200" />
                                                        <input type="text" placeholder="Reps" className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 w-1/2 text-slate-200" />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'meals' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center mb-1">
                                    <h2 className="text-lg font-bold">Lower-Carb Muscle & Type 3c Meals</h2>
                                </div>
                                <p className="text-xs text-slate-400 mb-4">Click **AI Swap** to rotate fresh, tuna-free meal ideas instantly.</p>

                                <div className="space-y-4">
                                    {currentMeals.map((recipe, idx) => (
                                        <div key={idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                            <div className="flex justify-between items-center mb-2">
                                                <span className="text-[10px] bg-emerald-500/10 text-emerald-400 font-bold px-2 py-0.5 rounded">{recipe.tag}</span>
                                                <div className="flex items-center space-x-2">
                                                    <button 
                                                        onClick={() => swapMealWithAI(idx, recipe.tag)}
                                                        disabled={swappingIndex === idx}
                                                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-700 flex items-center space-x-1 transition-all"
                                                    >
                                                        <span>{swappingIndex === idx ? '✨ Generating...' : '✨ AI Swap'}</span>
                                                    </button>
                                                    <span className="text-xs font-bold text-amber-400">{calculateCreon(recipe.fat)} Creon Caps</span>
                                                </div>
                                            </div>
                                            <h3 className="font-bold text-sm text-slate-100 mb-1">{recipe.name}</h3>
                                            <p className="text-xs text-slate-400 mb-3">{recipe.calories} kcal | P: {recipe.protein}g | C: {recipe.carbs}g | F: {recipe.fat}g</p>
                                            <button onClick={() => addMealToLog(recipe)} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs py-2 rounded-xl">Log Meal & Add Creon</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <h2 className="text-lg font-bold mb-1">Configuration & Settings</h2>
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-300 block mb-1">
                                            Gemini API Key (Saved Locally)
                                        </label>
                                        <div className="flex space-x-2">
                                            <input 
                                                type="password" 
                                                value={tempKeyInput} 
                                                onChange={(e) => setTempKeyInput(e.target.value)}
                                                placeholder="Paste Gemini API Key here"
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 font-mono"
                                            />
                                            <button 
                                                onClick={saveApiKey}
                                                className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl whitespace-nowrap"
                                            >
                                                Save Key
                                            </button>
                                        </div>
                                        {keySavedMsg && <span className="text-[10px] text-emerald-400 mt-1 block">✓ API Key saved permanently to your device!</span>}
                                    </div>

                                    <div className="border-t border-slate-800 pt-4">
                                        <label className="text-xs font-semibold text-slate-300 block mb-1">
                                            Fat-to-Creon Ratio (1 capsule per {fatRatio} grams of fat)
                                        </label>
                                        <div className="flex items-center space-x-3">
                                            <input 
                                                type="range" 
                                                min="5" 
                                                max="25" 
                                                value={fatRatio} 
                                                onChange={(e) => setFatRatio(Number(e.target.value))} 
                                                className="w-full accent-emerald-500 cursor-pointer" 
                                            />
                                            <span className="font-bold text-emerald-400 text-sm whitespace-nowrap">1 : {fatRatio}g</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* LIVE CAMERA & BARCODE MODAL */}
                    {scannerMode && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 relative overflow-hidden">
                                <button onClick={() => { setScannerMode(null); setScanResult(null); stopCamera(); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-200 z-10">✕</button>
                                <h3 className="text-base font-bold mb-1">
                                    {scannerMode === 'camera' ? '📷 AI Live Food Snapshot' : '🏷️ Live Barcode Lookup'}
                                </h3>
                                <p className="text-xs text-slate-400 mb-4">
                                    {scannerMode === 'camera' ? 'Point camera at your meal plate and tap capture to run Gemini Vision AI.' : 'Enter your packet barcode number to query live product databases.'}
                                </p>

                                {!scanResult ? (
                                    <div className="space-y-4">
                                        <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden relative flex flex-col items-center justify-center min-h-[260px]">
                                            <video ref={videoRef} autoPlay playsInline muted className="w-full h-56 object-cover"></video>
                                            
                                            {isAnalyzing && (
                                                <div className="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-4">
                                                    <div className="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                                                    <p className="text-xs font-bold text-emerald-400">Processing via Gemini AI Vision...</p>
                                                </div>
                                            )}
                                        </div>

                                        {scannerMode === 'camera' ? (
                                            <button 
                                                onClick={captureAndAnalyze} 
                                                disabled={isAnalyzing}
                                                className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs py-3 rounded-xl transition-all"
                                            >
                                                {isAnalyzing ? 'Analyzing...' : 'Capture & Analyze Plate via AI'}
                                            </button>
                                        ) : (
                                            <div className="space-y-3">
                                                <div className="flex space-x-2">
                                                    <input 
                                                        type="text" 
                                                        id="manualBarcode" 
                                                        placeholder="Enter Barcode e.g. 5000158" 
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 font-mono"
                                                    />
                                                    <button 
                                                        onClick={() => {
                                                            const val = document.getElementById('manualBarcode').value || '5000158';
                                                            handleBarcodeLookup(val);
                                                        }}
                                                        disabled={isAnalyzing}
                                                        className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-xl whitespace-nowrap"
                                                    >
                                                        Lookup
                                                    </button>
                                                </div>
                                                <button 
                                                    onClick={() => handleBarcodeLookup('5000158')}
                                                    disabled={isAnalyzing}
                                                    className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs py-2.5 rounded-xl border border-slate-700"
                                                >
                                                    Lookup Sample Peanut Butter / Protein Packet
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-slate-800/50 border border-slate-700/50 p-4 rounded-xl">
                                            <span className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider block mb-1">AI Analysis Complete</span>
                                            <h4 className="font-bold text-sm text-slate-100 mb-2">{scanResult.name}</h4>
                                            <p className="text-xs text-slate-400 mb-3">{scanResult.calories} kcal | P: {scanResult.protein}g | C: {scanResult.carbs}g | F: {scanResult.fat}g</p>
                                            <div className="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-xl flex justify-between items-center">
                                                <span className="text-xs text-emerald-400 font-bold">Required Creon Dose</span>
                                                <span className="text-base font-black text-emerald-400">{calculateCreon(scanResult.fat)} Capsules</span>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => addMealToLog(scanResult)} 
                                            className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs py-3 rounded-xl transition-all"
                                        >
                                            Add to Daily Tracker
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <nav className="bg-slate-900 border-t border-slate-800 fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto grid grid-cols-4 py-2 px-3 text-center">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center py-1 ${activeTab === 'dashboard' ? 'text-emerald-400' : 'text-slate-400'}`}>
                            <span className="text-lg">📊</span><span className="text-[10px] mt-1 font-semibold">Dashboard</span>
                        </button>
                        <button onClick={() => setActiveTab('workouts')} className={`flex flex-col items-center py-1 ${activeTab === 'workouts' ? 'text-emerald-400' : 'text-slate-400'}`}>
                            <span className="text-lg">💪</span><span className="text-[10px] mt-1 font-semibold">Workouts</span>
                        </button>
                        <button onClick={() => setActiveTab('meals')} className={`flex flex-col items-center py-1 ${activeTab === 'meals' ? 'text-emerald-400' : 'text-slate-400'}`}>
                            <span className="text-lg">🥗</span><span className="text-[10px] mt-1 font-semibold">Meals</span>
                        </button>
                        <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center py-1 ${activeTab === 'settings' ? 'text-emerald-400' : 'text-slate-400'}`}>
                            <span className="text-lg">⚙️</span><span className="text-[10px] mt-1 font-semibold">Settings</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
